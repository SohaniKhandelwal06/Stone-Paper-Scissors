<!DOCTYPE html>

<html>

<head>
    <title>Stone Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<div class="game">

    <h1>Stone Paper Scissors</h1>

    <p>Choose one:</p>

    <div class="choices">

        <button onclick="playGame('stone')">
            🪨 Stone
        </button>

        <button onclick="playGame('paper')">
            📄 Paper
        </button>

        <button onclick="playGame('scissors')">
            ✂️ Scissors
        </button>

    </div>

    <h2 id="result">Make your choice!</h2>

    <p id="player-choice">Your choice:</p>

    <p id="computer-choice">Computer choice:</p>

    <div class="score">

        <p>
            Your Score:
            <span id="player-score">0</span>
        </p>

        <p>
            Computer Score:
            <span id="computer-score">0</span>
        </p>

    </div>

    <button class="reset" onclick="resetGame()">
        Reset Game
    </button>

</div>

<script src="script.js"></script>
```

</body>

</html>
